<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Deep violet field, lit from the top left. -->
    <linearGradient id="field" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#9d8bff"/>
      <stop offset="0.55" stop-color="#6a54f0"/>
      <stop offset="1" stop-color="#3a2bb8"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d2ff"/>
    </linearGradient>
    <!-- The core: signal gold, glowing. -->
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffc94a"/>
      <stop offset="1" stop-color="#ff9f1a"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc94a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffc94a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="17" fill="url(#field)"/>
  <rect width="64" height="64" rx="17" fill="url(#sheen)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="16.25" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- The letter c as an open orbit. -->
  <path d="M45.2 20.4A17.4 17.4 0 1 0 45.2 43.6" fill="none" stroke="url(#ring)" stroke-width="6.4" stroke-linecap="round"/>
  <!-- A fainter inner orbit, so the core reads as held, not floating. -->
  <path d="M39.2 25.6A9.6 9.6 0 1 0 39.2 38.4" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="13" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="6.1" fill="url(#core)"/>
  <circle cx="30.2" cy="30" r="1.7" fill="#ffffff" fill-opacity="0.85"/>
</svg>
